services:

  # ==========================================================
  # NODE HN
  # ==========================================================
  postgres_hn:
    image: postgres:18
    container_name: warehouse_postgres_hn
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_HN}

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    ports:
      - "${POSTGRES_PORT_HN}:5432"

    volumes:
      - postgres_hn_data:/var/lib/postgresql

      - ./nodes/node_hn/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
      - ./nodes/node_hn/02_create_global_tables.sql:/docker-entrypoint-initdb.d/02_create_global_tables.sql:ro
      - ./nodes/node_hn/03_create_hn_fragments.sql:/docker-entrypoint-initdb.d/03_create_hn_fragments.sql:ro
      - ./nodes/node_hn/04_create_constraints.sql:/docker-entrypoint-initdb.d/04_create_constraints.sql:ro
      - ./nodes/node_hn/05_insert_hn_data.sql:/docker-entrypoint-initdb.d/05_insert_hn_data.sql:ro
      - ./nodes/node_hn/06_create_views.sql:/docker-entrypoint-initdb.d/06_create_views.sql:ro
      - ./nodes/node_hn/07_create_indexes.sql:/docker-entrypoint-initdb.d/07_create_indexes.sql:ro
      - ./nodes/node_hn/08_create_transaction_support.sql:/docker-entrypoint-initdb.d/08_create_transaction_support.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_HN}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - warehouse_network


  # ==========================================================
  # NODE DN
  # ==========================================================
  postgres_dn:
    image: postgres:18
    container_name: warehouse_postgres_dn
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DN}

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    ports:
      - "${POSTGRES_PORT_DN}:5432"

    volumes:
      - postgres_dn_data:/var/lib/postgresql

      - ./nodes/node_dn/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
      - ./nodes/node_dn/02_create_global_tables.sql:/docker-entrypoint-initdb.d/02_create_global_tables.sql:ro
      - ./nodes/node_dn/03_create_dn_fragments.sql:/docker-entrypoint-initdb.d/03_create_dn_fragments.sql:ro
      - ./nodes/node_dn/04_create_constraints.sql:/docker-entrypoint-initdb.d/04_create_constraints.sql:ro
      - ./nodes/node_dn/05_insert_dn_data.sql:/docker-entrypoint-initdb.d/05_insert_dn_data.sql:ro
      - ./nodes/node_dn/06_create_views.sql:/docker-entrypoint-initdb.d/06_create_views.sql:ro
      - ./nodes/node_dn/07_create_indexes.sql:/docker-entrypoint-initdb.d/07_create_indexes.sql:ro
      - ./nodes/node_dn/08_create_transaction_support.sql:/docker-entrypoint-initdb.d/08_create_transaction_support.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_DN}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - warehouse_network


  # ==========================================================
  # NODE HCM
  # ==========================================================
  postgres_hcm:
    image: postgres:18
    container_name: warehouse_postgres_hcm
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_HCM}


    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "${POSTGRES_PORT_HCM}:5432"

    volumes:
      - postgres_hcm_data:/var/lib/postgresql

      - ./nodes/node_hcm/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
      - ./nodes/node_hcm/02_create_global_tables.sql:/docker-entrypoint-initdb.d/02_create_global_tables.sql:ro
      - ./nodes/node_hcm/03_create_hcm_fragments.sql:/docker-entrypoint-initdb.d/03_create_hcm_fragments.sql:ro
      - ./nodes/node_hcm/04_create_constraints.sql:/docker-entrypoint-initdb.d/04_create_constraints.sql:ro
      - ./nodes/node_hcm/05_insert_hcm_data.sql:/docker-entrypoint-initdb.d/05_insert_hcm_data.sql:ro
      - ./nodes/node_hcm/06_create_views.sql:/docker-entrypoint-initdb.d/06_create_views.sql:ro
      - ./nodes/node_hcm/07_create_indexes.sql:/docker-entrypoint-initdb.d/07_create_indexes.sql:ro
      - ./nodes/node_hcm/08_create_transaction_support.sql:/docker-entrypoint-initdb.d/08_create_transaction_support.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_HCM}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - warehouse_network


  # ==========================================================
  # CENTRAL DATABASE
  # ==========================================================
  postgres_central:
    image: postgres:18
    container_name: warehouse_postgres_central
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CENTRAL}

    ports:
      - "${POSTGRES_PORT_CENTRAL}:5432"

    volumes:
      - postgres_central_data:/var/lib/postgresql

      - ./data_center/central_database/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
      - ./data_center/central_database/02_create_tables.sql:/docker-entrypoint-initdb.d/02_create_tables.sql:ro
      - ./data_center/central_database/03_create_constraints.sql:/docker-entrypoint-initdb.d/03_create_constraints.sql:ro
      - ./data_center/central_database/04_create_views.sql:/docker-entrypoint-initdb.d/04_create_views.sql:ro
      - ./data_center/central_database/05_create_indexes.sql:/docker-entrypoint-initdb.d/05_create_indexes.sql:ro
      - ./data_center/central_database/06_create_saga_monitoring.sql:/docker-entrypoint-initdb.d/06_create_saga_monitoring.sql:ro
      - ./data_center/central_database/07_create_saga_views.sql:/docker-entrypoint-initdb.d/07_create_saga_views.sql:ro
      - ./data_center/central_database/08_seed_data.sql:/docker-entrypoint-initdb.d/08_seed_data.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_CENTRAL}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - warehouse_network


  # ==========================================================
  # MONGODB
  # ==========================================================
  mongodb:
    image: mongo:8
    container_name: warehouse_mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    ports:
      - "${MONGO_PORT}:27017"

    volumes:
      - mongodb_data:/data/db

      - ./mongodb/01_init_database.js:/docker-entrypoint-initdb.d/01_init_database.js:ro
      - ./mongodb/02_create_collections.js:/docker-entrypoint-initdb.d/02_create_collections.js:ro
      - ./mongodb/03_create_indexes.js:/docker-entrypoint-initdb.d/03_create_indexes.js:ro
      - ./mongodb/04_insert_sample_events.js:/docker-entrypoint-initdb.d/04_insert_sample_events.js:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - warehouse_network


  # ==========================================================
  # SYNC SERVICE
  # ==========================================================
  sync_service:
    build:
      context: ./data_center/etl
      dockerfile: Dockerfile

    container_name: warehouse_sync_service
    restart: unless-stopped

    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_DATABASE:-warehouse_events}

      POSTGRES_HOST: postgres_central
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB_CENTRAL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      mongodb:
        condition: service_healthy
      postgres_hn:
        condition: service_healthy
      postgres_dn:
        condition: service_healthy
      postgres_hcm:
        condition: service_healthy
      postgres_central:
        condition: service_healthy

    volumes:
      - ./data_center/data_lake:/app/data_lake

    networks:
      - warehouse_network


  # ==========================================================
  # OUTBOX RELAY WORKER
  # ==========================================================
  outbox_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: warehouse_outbox_worker

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_HN: postgres_hn
      POSTGRES_PORT_HN: 5432
      POSTGRES_DB_HN: ${POSTGRES_DB_HN}
      POSTGRES_HOST_DN: postgres_dn
      POSTGRES_PORT_DN: 5432
      POSTGRES_DB_DN: ${POSTGRES_DB_DN}
      POSTGRES_HOST_HCM: postgres_hcm
      POSTGRES_PORT_HCM: 5432
      POSTGRES_DB_HCM: ${POSTGRES_DB_HCM}
      POSTGRES_HOST_CENTRAL: postgres_central
      POSTGRES_PORT_CENTRAL: 5432
      POSTGRES_DB_CENTRAL: ${POSTGRES_DB_CENTRAL}
      OUTBOX_ALL_NODES: "true"
      OUTBOX_POLL_INTERVAL: "3000"
      KAFKA_BROKERS: "kafka:9092"

    depends_on:
      postgres_hn:
        condition: service_healthy
      postgres_dn:
        condition: service_healthy
      postgres_hcm:
        condition: service_healthy
      postgres_central:
        condition: service_healthy

    networks:
      - warehouse_network


  # ==========================================================
  # NGINX REVERSE PROXY / API GATEWAY
  # ==========================================================
  nginx:
    image: nginx:alpine
    container_name: warehouse_nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - warehouse_network


  # ==========================================================
  # APACHE KAFKA (KRAFT SINGLE BROKER)
  # ==========================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: warehouse_kafka
    restart: unless-stopped

    ports:
      - "9092:9092"
      - "9094:9094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - warehouse_network


# ==========================================================
# VOLUMES
# ==========================================================

volumes:

  postgres_hn_data:
    name: warehouse_postgres_hn_data

  postgres_dn_data:
    name: warehouse_postgres_dn_data

  postgres_hcm_data:
    name: warehouse_postgres_hcm_data

  postgres_central_data:
    name: warehouse_postgres_central_data

  mongodb_data:
    name: warehouse_mongodb_data

  kafka_data:
    name: warehouse_kafka_data


# ==========================================================
# NETWORK
# ==========================================================

networks:

  warehouse_network:
    name: warehouse_network
    driver: bridge