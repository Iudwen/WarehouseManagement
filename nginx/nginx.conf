# ==========================================================
# UPSTREAM & RATE LIMITING CONFIGURATION
# ==========================================================
upstream warehouse_backend {
    server host.docker.internal:5000;
}

# 1. Login zone: 10 requests per minute per IP with burst 5 (anti brute-force while supporting multi-role demo)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# 2. General API zone: 30 requests per second per IP (general CRUD & dashboard reports)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Return HTTP 429 Too Many Requests when rate limit is exceeded
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ==========================================================
    # SECURITY HEADERS
    # ==========================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Custom 429 JSON response for API rate limits
    error_page 429 = @rate_limit_exceeded;
    location @rate_limit_exceeded {
        default_type application/json;
        return 429 '{"success":false,"message":"Quá nhiều yêu cầu, vui lòng thử lại sau giây lát (Rate limit exceeded)."}';
    }

    # ==========================================================
    # RATE LIMITING: LOGIN API
    # ==========================================================
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://warehouse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ==========================================================
    # BACKEND API REVERSE PROXY (GENERAL API RATE LIMIT)
    # ==========================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://warehouse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ==========================================================
    # BACKEND HEALTH ENDPOINT (EXEMPT FROM RATE LIMIT)
    # ==========================================================
    location = /health {
        proxy_pass http://warehouse_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # SWAGGER UI REVERSE PROXY (EXEMPT FROM RATE LIMIT)
    # ==========================================================
    location /api-docs {
        proxy_pass http://warehouse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # STATIC BUILD ASSETS (CACHED)
    # ==========================================================
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        try_files $uri =404;
    }

    # ==========================================================
    # REACT ROUTER SPA FALLBACK (F5 / DIRECT SUB-ROUTE URL)
    # ==========================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
